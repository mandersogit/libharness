  - message: |
      docs: v6 retrospective + asyncio-in-thread direction exploration

      Vendor v6-threaded as a follow-on ChatGPT-authored predecessor at
      `dev-notes/predecessors/v6-threaded/`. v6 is the thread-owned
      reshaping that came back after the v5 synthesis — keeps the asyncio
      core but wraps it in a `HarnessRuntime` with a dedicated loop thread
      and a `PiAgentHarness` proxy for sync caller access.

      Two new design docs:

        - `2026-05-17-v6-threaded-comparison.md` — analysis of v6 vs the
          current v5-port + 2026-05-15 threads-rewrite plan. Identifies
          v6 as exactly the option B ("sync facade over async core") that
          the concurrency-model discussion explicitly rejected, plus the
          deltas we'd carry forward (set_model fix, protocolVersion).

        - `2026-05-17-v6-as-base-direction.md` — proposes treating v6 as
          a forward direction, not just a historical artifact. The `on_*`
          hooks color problem is solvable under v6 by calling a sync
          handler from inside `async def _dispatch_event` (or via
          `run_in_executor`); pi-side asynchrony stays intact. Includes
          H1/H2/H3 dispatch sketches plus MCA/MCA-D evolutions, the
          hook-naming co-design that fed the v7 request.

      This is the start of a direction shift. The 2026-05-15
      threads-rewrite plan ("primarily D" — threads end-to-end, FT-first)
      is still ready-for-implementation on spark, but this branch
      (`asyncio-in-thread`) explores the alternative. Decision register
      in `docs/DESIGN.md` not yet updated; supersession happens when the
      v8 port lands.
