  - message: |
      docs: v7 follow-on (Agent class with notification hooks) + analysis

      Send a v7 request to ChatGPT building on v6: add an `Agent` class
      with `on_X` / `async_on_X` hooks for the 10 core agent-loop events
      (MCA-D pattern — parallel sync/async methods, declared on the base
      class with `None` defaults, `__init_subclass__` validation for
      both-defined collisions and typo'd hook names). Result vendored at
      `dev-notes/predecessors/v7-threaded-agent-hooks/`.

      Three new design docs:

        - `2026-05-17-v7-request.md` — the prompt sent to ChatGPT,
          framed as a conversational follow-on (no internal "v7" label;
          ChatGPT sees this as just the next turn in its thread).

        - `2026-05-17-v7-analysis.md` — analysis of what ChatGPT
          produced. 18 tests passing, mypy/pyright/ruff clean. All
          locked decisions honored. Six minor items A–F flagged for
          discussion before port.

        - `2026-05-17-v7-event-verification.md` — verifies v7's
          `_EVENT_NAMES` against pi-mono source. v7's 10 names are all
          correct; 7 session-layer events are missing; 2 RPC envelope
          events not modeled. Establishes the three-surface framing
          (notification / participation / RPC envelope) that drove the
          v8 design. Includes a scope-correction section owning the
          earlier framing of "Agent is notification-only" as a unilateral
          call that was superseded by the author's clarified direction
          (participate in 100% of events; expensive ones opt-in).
