  - message: |
      docs: v8 follow-on (decision hooks + opt-in participation) + handoff

      Final ChatGPT pass in this exploration: add decision hooks
      (`decide_X` / `async_decide_X`) for all 19 of pi's participation
      events, with the subscribe-to-all + always-notify + gated-decide
      architecture. The TS shim subscribes to every participation event
      at extension load and picks per-fire between fire-and-forget
      (gate closed) and sync round-trip (gate open). One bridge call
      per fire either way; Python is always notified, pi only blocks
      when a `decide_X` is declared. Result vendored at
      `dev-notes/predecessors/v8-decision-hooks/`. 36 tests passing.

      Includes `agent_class_mca.py` alongside `agent_class.py` — the
      former is an in-tree post-review refinement extracting the 74
      hook ClassVar declarations into an `AgentHookSurface` mixin so
      the Agent class body is just dispatch logic + lifecycle. The
      four-quadrant hook ordering (sync notification / sync decision /
      async notification / async decision) lets sync-only users read
      half the file as relevant and ignore the other half.

      Three new design docs:

        - `2026-05-17-v8-request-notes.md` — working notes that became
          the v8 prompt. Captures the design conversation: gated
          handler model, method-existence opt-in trigger, raw-dict
          result shape, no-default-timeout posture, channel separation
          (decision events visible only via Agent hooks, not via
          `client.on_event`).

        - `2026-05-17-v8-request.md` — the prompt sent to ChatGPT.
          14 locked decisions; 12 specific test asks; per-event
          return-shape table to read from pi source; out-of-scope list.

        - `2026-05-17-v8-analysis.md` — analysis of what ChatGPT
          produced. All locked decisions honored. One real gap
          surfaced: 38 missing `on_X` / `async_on_X` declarations for
          decision events (validation accepts them; the slots aren't
          declared). Documents the in-tree post-review refinements
          (mixin extraction, four-quadrant ordering) and resolves all
          open questions:
            - Adopt v8 as the libharness baseline.
            - `AgentHookSurface` stays public (no leading underscore).
            - `PiPythonHarness` async surface stays for v1 of the port.
            - Items C (strict-mode end-to-end test) + E
              (`subscribe_client_events` simplification) addressed
              during port; A, B, D, F deferred.
            - Port adopts the 3-file split: `events.py` +
              `hook_surface.py` + `agent_class.py`.
          The port itself executes in the spark environment (which has
          codex-cli adversarial review), not in this checkout.

      Handoff updates:

        - `dev-notes/SESSION-STATE.md` rewritten for the direction
          shift. Captures the two parallel branches
          (`asyncio-in-thread` here; `threads-rewrite` on spark), the
          v6/v7/v8 progression, the locked decisions, the deferred
          items, and the new pending-tasks list anchored on the
          spark-side port.

        - `dev-notes/predecessors/README.md` updated to list v6/v7/v8
          alongside v1-v5, with the convention that vN+1 builds on vN
          (not independent syntheses).
