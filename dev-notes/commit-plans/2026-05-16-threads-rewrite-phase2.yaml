  - message: |
      feat(threads-rewrite): phase 2 — server.py threaded rewrite

      Full rewrite of ``src/libharness/pi/server.py`` from
      ``asyncio.start_server`` to ``socketserver.ThreadingTCPServer``. Thin
      ``async def`` shims preserved on ``start``/``close``/``__aenter__``/
      ``__aexit__`` so the still-asyncio ``harness.py`` and the async live
      tests stay green during phases 2-3. Phase 4 will drop the shims.

      Per-phase loop executed: implement → impl summary → codex-generated
      test plan → tests + 3-run flake check (zero flakes) → 3 adversarial
      reviewers (2 codex gpt-5.5 xhigh + 1 Opus) → fix → commit. Reviewers
      converged on 4 HIGH + 7 MODERATE findings; all addressed. See
      ``dev-notes/2026-05-16-threads-rewrite-plan-phase2-review-synthesis.md``
      for the full fix-by-fix breakdown.

      Headline design points:

      - ``ThreadingTCPServer`` subclass overrides ``process_request`` to
        gate via ``_handler_slots`` semaphore + add the handler ``Thread``
        to ``_active_handler_threads`` *before* ``t.start()`` (closes the
        v4-synthesis T2.5 timing window).
      - Per-execute private event loop via ``asyncio.run`` so async tool
        bodies still work during phases 2-3; sync tool bodies are invoked
        inside the same coroutine so ``asyncio.get_event_loop()`` keeps
        observing a loop (F9 review fix).
      - Sidecar disconnect-watcher thread per execute distinguishes ``b""``
        (cancel only) from non-empty bytes (cancel + protocol violation
        flag + warning log). In-band violation (extras in the same recv
        as the request) and a short-timeout pre-response drain close the
        sidecar/handler race the Opus reviewer reproduced.
      - ``bridge_write_timeout`` uses ``select.select`` write-readiness
        (T1.4-v4 deviation) — NOT ``socket.settimeout`` which would race
        the sidecar's ``recv(1)`` on the same socket. Best-effort: bounds
        pre-write only; documented in the constructor docstring. Wired
        through ``PiPythonHarness.bridge_write_timeout``.
      - ``_close_sync`` waits for ``_serve_entered`` before calling
        ``shutdown()`` (avoids the deadlock window between ``Thread.start()``
        and ``serve_forever()`` actually entering its loop), shuts active
        handler sockets to wake cooperative handlers fast, joins with a
        single 3 s total deadline (not 2 s per thread × max_handlers).
      - ``params`` validation strict (rejects non-dict / non-None); manifest
        requests also enforce half-duplex (``protocolViolation`` flagged).
      - ``_close_sync`` is concurrency-safe (``_close_lock``) and skips
        ``current_thread()`` in handler joins (close-from-handler hazard).

      Test coverage: 55 tests in ``tests/pi/test_server.py`` (was 1) plus
      14 regression tests for review findings; ``fake_pi_rpc.py`` extended
      to mode-driven (basic / ui-order / late-response /
      fatal-invalid-json / parallel-execute / slow-consumer); AST contract
      guard widened to include ``test_server.py``.

      87/87 tests pass on both ``local.venv`` (3.11) and ``local-ft.venv``
      (3.14t); six consecutive runs, zero flakes. ``make all`` clean.

      Bisect-baseline appended with phase-1 (retroactive — phase 1's commit
      didn't append) and phase-2 rows (phase-2 SHA placeholder; substituted
      at the start of the phase-3 commit).
