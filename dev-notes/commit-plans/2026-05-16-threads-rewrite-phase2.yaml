      docs(threads-rewrite): v4 plan revision + v1-v4 review-synthesis trail

      Bundle the in-flight planning artifacts left over from the v1→v4 plan
      revision cycle that informed phase 1+. Without these tracked, every
      ``dev-notes/2026-05-16-threads-rewrite-plan-v4-review-synthesis.md``
      citation in the in-tree synthesis docs would dangle. Three things:

      - The threads-rewrite plan itself was revised in-place (v3→v4) and
        elaborated with revision history, design answers, and a 14-row
        breaking-changes migration table. The modified plan is the contract
        phase 2/3/4 implement against.
      - Six adversarial reviewers reviewed v3; one reviewer flagged five
        Tier-1 races; v4 closed three and introduced one new
        (bridge_write_timeout / shared-socket); see
        `dev-notes/2026-05-16-threads-rewrite-plan-v4-review-synthesis.md`
        for the full triage.
      - The event-bridge proposal got an `In co-design` status update so
        future sessions know it's gated on phase-3-or-later concurrency
        primitives.
