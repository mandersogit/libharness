  - message: |
      docs(pi): port pi-distribution spike — dev-note + regression + gitignore

      A 2026-05-23 spike in the sibling workspace (~/git/github/libharness/,
      threads-rewrite branch) investigated how to deliver pi to libharness
      users. The substantive finding — that the precompiled pi binary
      published by earendil-works (per-platform tarballs on every GitHub
      release) works as a drop-in for libharness — is branch-independent
      and ports verbatim. This commit brings the spike artefact + a
      regression test into the canonical (asyncio-in-thread / v8) workspace.

      ## dev-notes/2026-05-23-deno-as-pi-runtime-spike.md

      Ported from the sibling workspace with a "Workspace port note"
      header explaining the branch context and two adjustments:

        - **Harness class names.** Historical smokes referenced below
          used `PiPythonHarness` (async; v8 preserved and still exports).
          The v8 port added `PiAgentHarness` (sync, thread-owned facade)
          and the `Agent` subclass that layers hooks on top.
        - **Artefact paths.** Historical experiments live in the sibling
          workspace; this workspace re-ran the load-bearing validation
          in its own `experiments/precompiled-pi-spike/` (gitignored).

      Re-verification under v8 (four corners — faux/live ×
      `PiAgentHarness`/`Agent`-subclass) passed first try on
      linux-arm64; the results table is in the "Re-verification under
      v8" section of the dev-note. See also the (Update 2026-05-24)
      note appended to the "Recommendations" section indicating the
      dev loop has since adopted the precompiled binary as default.

      ## tests/pi/test_precompiled_pi_binary.py

      `live`-marked regression that locks in the load-bearing
      "precompiled binary works as a drop-in" claim. Resolves the pi
      binary via PI_PRECOMPILED env var (preferred) or, as of the
      same-day vendoring implementation, the vendored binary at
      `<package>/_vendor/pi/pi` (automatic).

      ## .gitignore

      Adds two entries:

        - `experiments/` — exploratory scratch directory used by the
          spike (single-purpose smokes + downloaded binary artefacts).
        - `src/libharness/_vendor/` — preemptive for the same-day pi
          vendoring implementation (#2 in this plan), which lands the
          ~113 MB pi binary into that directory. Bundled here so the
          vendoring impl commit doesn't need to re-touch this file.

      ## Acceptance

        - mdformat --wrap keep + markdownlint-cli2 clean on the
          dev-note (verified during port).
        - Regression test passes on both venvs against the
          experiments/precompiled-pi-spike/pi/pi binary
          (0.39s on 3.11; 0.44s on 3.14t).
