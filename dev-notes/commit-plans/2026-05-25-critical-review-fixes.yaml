      ### dev-notes/2026-05-25-codex-cli-json-streaming.md (new)

      Captures the codex-cli `--json` event-streaming discovery from
      this session: three programmatic surfaces (`exec --json` /
      `mcp-server` / `app-server`); event types observed
      (`thread.started`, `turn.started/completed`, `item.started/
      completed` with sub-types `command_execution`, `agent_message`);
      caveats (line-1 cosmetic stderr noise, `2>/dev/null` + jq
      footgun, `< /dev/null` for non-interactive runs); recommended
      invocation pattern with parser snippets; future-build "Level 2"
      sketch for a `codex mcp-server`-driven harness analogous to
      `libharness.pi.PiRpcClient`. Status: `Draft (for review)`.

      ### dev-notes/SESSION-STATE.md

      New top-of-current-state bullet covering the C1/C2/C3 fixes.
      Test counts updated (157 unit + 3 live on 3.11; 155 unit + 3
      live on 3.14t with the 2 wheel-build tests skipped).

