commits:
  - message: |
      test(pi): port v8 test suite + strict-mode E2E for decision events (Item C)

      Phase 6 of the v8 port plan. Brings in the v8 test suite from
      `dev-notes/predecessors/v8-decision-hooks/tests/`, adds the
      strict-mode end-to-end coverage for decision events (analysis
      § Items C), and threads `pythonpath = ["."]` through pytest so
      cross-test imports resolve under `$VENV/bin/pytest` (the path
      `scripts/test.sh` invokes).

      ## v8 tests ported

        - test_agent_class.py (~10 v8 tests covering Agent class
          subclass validation, hook dispatch, MRO behavior, etc.)
        - test_decision_hooks.py (~12 v8 tests covering decision-hook
          dispatch, cancellation, timeouts, channel separation)
        - test_channel_separation.py (1 test that pins the "decision
          events do NOT reach raw client.on_event subscribers" rule)
        - test_pi_event_taxonomy.py (skips gracefully when pi-mono
          source isn't reachable via env var or links/pi)
        - test_threaded_agent.py (4 tests covering threading model,
          owner thread isolation, shared loop/tool pool)

      Imports renamed from `pi_python_harness` → `libharness.pi` and
      inter-test imports renamed from `tests.<X>` →
      `tests.pi.<X>` for the libharness layout.

      ## Item C — strict-mode end-to-end for decision events

      The pre-port analysis (`dev-notes/2026-05-17-v8-analysis.md`
      § Items worth discussing C) noted that the
      `_raise_on_unhandled_event = True` strict-mode logic was
      exercised for unknown events and for the 18 RPC notification
      events (`test_strict_mode_accepts_all_declared_notification_events`,
      ported from v8), but NOT end-to-end for the 19 decision events
      through `_async_on_bridge_event`. Three new tests added to
      `test_agent_class.py` close that gap:

        - test_strict_mode_accepts_all_decision_events_notify_only —
          subclass defines `on_<event>` for every decision event;
          fires each via the bridge in notify-only mode
          (`require_decision=False`); asserts all 19 fire.
        - test_strict_mode_accepts_all_decision_events_with_decide —
          subclass defines BOTH `on_<event>` and `decide_<event>`
          for every decision event; fires each in decision-required
          mode; asserts both observation and decision sides fire.
        - test_strict_mode_raises_on_unknown_decision_event — strict
          mode subclass without hooks must raise
          `UnhandledEventError` for an unknown decision event arriving
          on the bridge.

      ## Item E deferred

      The `subscribe_client_events` thread-bounce simplification
      (analysis § Items E) is NOT applied. The advisor's
      recommendations doc rated it "low-risk in isolation; low value
      too. Defer if it's contentious." Gate A.5's synthesis didn't
      flag the bounce as a finding. Without deeper analysis of the
      owner-thread vs loop-thread ownership semantics, the safe call
      is to defer to the post-port ergonomic pass.

      ## Test infrastructure fixes

        - tests/pi/fake_pi_rpc.py: updated to the v8 multi-line dict
          format; preserved the `data.received: request` echo on
          set_model responses so the existing v5
          test_set_model_uses_modelId_field regression test still
          asserts on the wire shape.
        - pyproject.toml: added `pythonpath = ["."]` to
          [tool.pytest.ini_options]. `python -m pytest` injects this
          for free but the bare `$VENV/bin/pytest` shim that
          scripts/test.sh invokes does not. Required for the
          cross-test imports.

      ## Acceptance

        - `make all` green on local.venv (3.11) and local-ft.venv (3.14t).
        - 56 tests pass; 1 skipped (test_pi_event_taxonomy needs pi-mono
          source); 2 deselected (live tests, run at Gate B).
        - Up from 25 tests pre-Phase-6 (the test count grew by 31:
          ~26 ported from v8 + 3 new strict-mode E2E + ruff fixups).

      Ruff version-skew fixups applied during the port (continuation
      of the Phase 1/Phase 5.5 pattern): import-ordering auto-fixes
      across the new test files; no semantic change.
