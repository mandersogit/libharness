  - message: |
      docs: vendor v1–v5 predecessors + sweep ~/Downloads citations

      Pulls the predecessor proof-of-concept iterations into the repo so
      every citation in the review docs is verifiable in-tree, and the
      `~/Downloads/pi_python_harness/` working folder can be retired.

      **New tree: dev-notes/predecessors/ (108 files, ~1.3 MB).**

        - `prompt.txt`: the prompt that drove all four AI runs producing
          v1–v4.
        - `v1/`, `v2/`, `v3/`, `v4/`, `v5-synthesis/`: each mirrors the
          inner layout of the corresponding `~/Downloads/version-*`
          directory — `docs/`, `src/` (or `pi_python_harness/` at top
          level in v2), `tests/`, `examples/`, `pyproject.toml`,
          `README.md`, plus the v5 `LICENSE`. Frozen historical
          artifacts; editorial policy is "do not reformat in place".
        - `README.md`: index explaining origin, layout, what's
          intentionally not vendored (pi-main is reached via
          `links/pi/`; the ~700 MB sandbox is throwaway), and the
          toolchain exclusions below.

      **Citation sweep across dev-notes.**

      `~/Downloads/pi_python_harness/...` paths repointed to in-tree
      equivalents:

        - pi source citations → `links/pi/...` (a symlink each
          contributor sets up locally to their pi checkout; gitignored).
        - Predecessor source / docs citations →
          `dev-notes/predecessors/v*/...`.

      Files touched by the sweep:

        - `dev-notes/2026-05-14-event-bridge-proposal.md` (1 ref)
        - `dev-notes/2026-05-14-pi-internals-notes.md` (2 refs)
        - `dev-notes/2026-05-14-pi-python-harness-v5-synthesis-review.md`
          (6 refs)
        - `dev-notes/2026-05-14-pi-python-harness-version-review.md`
          (~7 refs)
        - `dev-notes/README.md` (index rewrite + predecessors entry)

      **Toolchain guards** so the vendored material doesn't pollute the
      dev loop:

        - `Makefile`: `MD_FILES` adds
          `-not -path 'dev-notes/predecessors/v*/*'` (only the index
          README is linted/formatted; the v*/ vendored content is
          skipped).
        - `pyproject.toml`:
          `tool.pytest.ini_options.norecursedirs` adds `dev-notes`,
          `links`, `.sandbox`, and both venvs. Belt-and-braces;
          `testpaths` already scopes collection to `tests/` but a stray
          `pytest dev-notes/...` would otherwise walk in.
        - `.gitignore`: `links/` (per-developer symlinks — each
          contributor sets up `links/pi` → their pi checkout).

      Validation: `make all` clean on both venvs; `make lint-md` shows
      only the pre-existing MD040 warning at pi-internals-notes.md:108.
      No active `~/Downloads/` references remain (3 expected ones: the
      SESSION-STATE tombstone, predecessors/README.md origin notes, and
      the historical commit-plan record).
    files:
