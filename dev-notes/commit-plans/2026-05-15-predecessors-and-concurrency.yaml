  - message: |
      build: dual-venv scaffold + docs: concurrency-model decision

      Equips libharness for the C+D concurrency model and records the
      decision.

      **Concurrency decision: primarily D (threads on freethreaded
      CPython 3.14t — optimize for FT parallelism opportunities),
      backwards-compatible with C (threads on standard CPython 3.11+
      under the GIL, verified by `make test-311`).** Sync `def` for
      tool functions and `on_*` hooks; `async def` rejected at
      decoration. The asyncio → threads rewrite of
      `rpc_client/server/tools/PiPythonHarness` is the next
      implementation milestone, gated on Agent-class co-design.

      Doc changes:

        - `dev-notes/2026-05-15-concurrency-model-discussion.md`:
          frontmatter "In co-design" → "Resolved"; new "Resolution
          (2026-05-15)" section at top summarizing the decision and
          citing the dual-venv scaffolding below as the verification
          surface. Original analysis preserved beneath.
        - `docs/DESIGN.md § Resolved decisions`: new 2026-05-15 row.
          Refactored the whole table to compact 2-column form with the
          full rationale in a sidecar list (mdformat reflow on the
          3-column form aligned columns past the 150-col rule; sidecar
          is what CLAUDE.md prescribes for overflow).
        - `dev-notes/SESSION-STATE.md`: fresh-session quickstart now
          treats concurrency as historical reference, not an open gate.
          "Current state" gains a bullet citing the decision and the
          dual-venv scaffold below. Pending tasks reordered so the
          asyncio → threads rewrite is the next implementation
          milestone; event-bridge remains the one open co-design gate.

      **Dual-venv scaffold (verification surface for C+D).**
      `local.venv/` stays Python 3.11 standard; new `local-ft.venv/` is
      Python 3.14t freethreading (`sys._is_gil_enabled() == False`).
      Both built from `/opt/miniforge/envs/base-py3-{11,14-nogil}/`.
      All dev deps install cleanly as cp314t wheels (mypy 2.1, pyright
      1.1.409, ruff 0.15, pytest 9, hypothesis 6, coverage 7).

        - `Makefile`: PYTHON_311 / PYTHON_314T interpreter vars;
          VENV / VENV_FT venv paths; per-venv tool path vars; install
          / lint / typecheck (mypy + pyright) / test / test-live / all
          targets split into -311 and -ft variants. mypy/pyright run
          with `--python-version 3.14` on the ft side. Top-level
          `make all` runs both. `format` / `lint-fix` / `format-md`
          stay single-source on the 3.11 venv.
        - `scripts/lib/env.sh`: `VENV` honors `LIBHARNESS_VENV` env
          override, so `scripts/test.sh` can target the ft venv via
          `LIBHARNESS_VENV=$(pwd)/local-ft.venv scripts/test.sh ...`.
          No `activate` anywhere — explicit absolute paths throughout
          per CLAUDE.md ("never activate a venv").
        - `.gitignore`: `local-ft.venv/`.

      Validation: `make all` clean on both venvs; 7 unit + 1 set_model
      regression pass under both Python 3.11 and 3.14t.
