repo: .

commits:
  - message: |
      refactor(pi): split agent_class.py into events / hook_surface / agent_class

      Phase 4 of the v8 port plan. Carves the post-Phase-3 monolithic
      agent_class.py (which had grown to 612 lines with the 112 ClassVar
      declarations + dispatcher logic + lifecycle) into three files with
      a clear dependency chain.

      New files:

        - src/libharness/pi/events.py (~75 lines)
            * AgentEvent, HookContext, UnhandledEventError.
            * No upward dependencies.
            * Smallest of the three.

        - src/libharness/pi/hook_surface.py (~270 lines)
            * AgentHookSurface mixin: four frozensets, config ClassVars,
              four hook type aliases (AsyncAgentHook, SyncAgentHook,
              AsyncDecisionHook, SyncDecisionHook), all 112 hook
              ClassVars in four-quadrant order with comment headers.
            * Validation classmethods (_validate_declared_hook_names,
              _validate_effective_hook_collisions,
              _validate_decision_timeouts) — moved from Agent class
              because they only read class-level state from the surface
              they validate. Still called via cls._validate_*() from
              Agent.__init_subclass__ through MRO lookup.
            * Imports AgentEvent from .events for the type aliases.

      Trimmed:

        - src/libharness/pi/agent_class.py (~225 lines, down from 612)
            * Now contains only the Agent class:
              __init_subclass__ (validation triggers), __init__ /
              start / close lifecycle, the two async dispatchers
              (_async_on_event for RPC notification,
              _async_on_bridge_event for decision events),
              _dispatch_notification_hook, _dispatch_decision_hook,
              install / uninstall agent event dispatcher helpers,
              _initial_open_gates_for_class,
              _decision_timeouts_for_manifest, plus the module helpers
              _call_decision_handler and _handler_wants_context.
            * cast(object, Agent) pyright-narrowing escape hatch moved
              to end of file with Agent.
            * Imports AgentHookSurface from .hook_surface and the
              data types from .events.

      Updated:

        - src/libharness/pi/__init__.py
            * Re-routes AgentEvent / HookContext / UnhandledEventError
              imports through .events instead of .agent_class.
            * Adds AgentHookSurface to the package exports (public per
              author resolution #2 in
              dev-notes/2026-05-17-v8-analysis.md § Resolutions).

      Import dependency flow: agent_class → hook_surface → events.

      Acceptance verified:

        - All four import paths work:
          * from libharness.pi.events import AgentEvent, HookContext, UnhandledEventError
          * from libharness.pi.hook_surface import AgentHookSurface
          * from libharness.pi.agent_class import Agent
          * from libharness.pi import Agent, AgentEvent, AgentHookSurface, HookContext, UnhandledEventError
        - MRO unchanged: [Agent, AgentHookSurface, PiAgentHarness, object].
        - AgentHookSurface ClassVar hook count: 112 (37+37+19+19).
        - `make all` green on local.venv (3.11) and local-ft.venv (3.14t).
        - 7 unit tests pass (set_model regression still green).

      No semantic changes; this is a pure file-organization refactor.
    files:
      - src/libharness/pi/events.py
      - src/libharness/pi/hook_surface.py
      - src/libharness/pi/agent_class.py
      - src/libharness/pi/__init__.py
      - dev-notes/commit-plans/2026-05-17-phase-4-three-file-split.yaml
