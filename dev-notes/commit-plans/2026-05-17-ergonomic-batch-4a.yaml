      fix(pi): ergonomic-pass batch 4a — threading-model small fixes (F9 F13 F15 F16)

      Fourth batch of post-Gate-C fixes. Four threading/lifecycle hygiene
      improvements that don't need design discussion. The two remaining
      items in the threading cluster (F8 — shared hook_executor design;
      F14 — reader-task-death tear-down direction) are real design calls
      and need the 4-LLM council; they stay on the fix-now list for the
      next session.

      ## Fixes

      **F9 — `close()` ↔ `submit()` race.** Pre-fix: between `submit()`'s
      `if self._closed` check and the subsequent `_commands.put(command)`,
      a concurrent `close()` could set `_closed = True` and put `_STOP`
      on the queue. The late command would then sit behind `_STOP` and
      hang the caller forever. Post-fix: added `_close_lock`
      (threading.Lock) on `PiAgentHarness`. Both `submit()`'s
      check-and-put and `close()`'s set-and-put are guarded by the lock.
      Either the submit lands before close (command runs normally), or
      submit sees `_closed = True` and raises — never queued behind
      `_STOP`. The lock is taken AFTER `start_owner_thread()` (which
      takes its own `_owner_start_lock`) to avoid lock nesting.

      **F13 — `watch_disconnect` cancelled-on-completion.** Pre-fix:
      the `finally` block of `watch_disconnect` set
      `cancelled.set()` unconditionally. So when the parent task
      cancelled the watcher after a normal handler completion,
      `cancelled` flipped to True — breaking the
      `HookContext.cancelled` contract (which means "the bridge
      disconnected while we were deciding", not "the parent task is
      tearing down"). Post-fix: distinguished EOF/error from
      asyncio.CancelledError. Only EOF and reader errors set
      `cancelled`; parent-cancellation re-raises CancelledError
      without flipping the flag. Applied at both `watch_disconnect`
      sites (`_dispatch_bridge_event` and `_dispatch_execute`).

      **F15 — Bound the `close()` gather.** Pre-fix: in `close()`,
      `await asyncio.gather(task, return_exceptions=True)` could hang
      forever if the reader was inside a handler that swallowed
      `CancelledError`. Post-fix: wrapped in `asyncio.wait_for(...,
      timeout=2.0)` + `contextlib.suppress(asyncio.TimeoutError)`. Batch
      3's F3 fix requires UI handlers to re-raise CancelledError so
      this is mostly defense in depth, but a malicious or buggy
      handler can no longer wedge teardown.

      **F16 — Suppress `ProcessLookupError` in SIGTERM block.** Pre-fix:
      if pi exited between the initial `wait_for(proc.wait())` timeout
      and the subsequent `proc.send_signal(SIGTERM)`, `send_signal`
      raised ProcessLookupError. The exception bubbled out of the
      `except TimeoutError` branch and `close()` exited early before
      reaching `_fail_pending` / `self.process = None`. Post-fix:
      wrapped both signal calls (SIGTERM and the subsequent SIGKILL
      fallback) in `contextlib.suppress(ProcessLookupError)` so
      cleanup always reaches the end.

      ## Tests

      `tests/pi/test_ergonomic_pass_cluster4a.py` (new, 4 cases):

      - `test_submit_after_close_raises_immediately_not_hangs` — F9
        post-close submit.
      - `test_concurrent_close_and_submit_no_queued_behind_stop` — F9
        actual race (8 submitters + 1 closer).
      - `test_watch_disconnect_does_not_flip_cancelled_on_parent_cancel` —
        F13; handler observes cancelled=False during normal completion.
      - `test_close_handles_process_lookup_error_during_sigterm` — F16;
        monkeypatches `proc.send_signal` to raise PLE, verifies close()
        still nulls process/tasks/_pending.

      F15 is defensively layered on top of F3/F4 fixes; a dedicated
      regression would require constructing a handler that swallows
      CancelledError, which the F3/F4 contract explicitly forbids.
      The defense remains in code; future test gap noted in the
      deferred-items doc.

      ## Acceptance

      - 117 tests pass on `local.venv` (3.11) and `local-ft.venv`
        (3.14t). Up from 113.
      - Ruff / mypy / pyright clean.
      - `close()` cleanup function in `agent.py` had to flatten a
        nested `if` (ruff SIM102 auto-fix would have missed it; manual
        flatten with `and` chaining).

      Deferred-items doc rolls forward: 2 fix-now remaining (F8, F14
      — both design calls), 10 remain-deferred, 26 done (was
      6/10/22).
