[project]
name = "py-pi-harness"
version = "0.1.0"
description = "Python-first wrapper for the Pi coding-agent harness using RPC mode and a minimal TypeScript extension shim."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Generated prototype" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_pi_harness"]
include = ["src/py_pi_harness/shims/*.ts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
