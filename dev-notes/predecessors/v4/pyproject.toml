[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-python-harness"
version = "0.1.0"
description = "Python-first host and tool bridge for Pi RPC mode"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Generated prototype" }]

[tool.setuptools.packages.find]
where = ["src"]
