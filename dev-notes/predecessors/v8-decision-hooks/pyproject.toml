[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pi-python-harness"
version = "0.3.0"
description = "Python-first thread-owned harness for Pi RPC with a minimal TypeScript tool bridge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Synthesis generated from four Pi harness attempts" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10", "pyright>=1.1", "ruff>=0.5"]

[project.scripts]
pi-python-harness = "pi_python_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_python_harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pi_python_harness"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src/pi_python_harness"]
pythonVersion = "3.11"
