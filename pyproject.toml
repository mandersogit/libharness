[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libharness"
version = "0.0.1"
description = "Python-first harness around the Pi agent harness."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{ name = "manders2k" }]
keywords = ["ai", "agent", "coding-agent", "llm", "pi", "harness"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.0",
  "mypy>=1.8",
  "pyright>=1.1",
  "ruff>=0.3",
  "hypothesis>=6.0",
  # Markdown formatter for `make format-md`. `mdformat-gfm` teaches mdformat
  # about GitHub-Flavored Markdown (prerequisite for `mdformat-tables`,
  # which aligns GFM table column widths). `mdformat-frontmatter` preserves
  # the YAML frontmatter blocks dev-notes/ files use (without it, the
  # leading `---` gets mangled into a horizontal rule).
  #
  # `markdownlint-cli2` is intentionally NOT here — it's a Node tool sourced
  # from /opt/miniforge/envs/dev-tools/ via explicit absolute paths in the
  # Makefile (NODE / MARKDOWNLINT_CLI2). Do not reference that env as a
  # Python interpreter.
  "mdformat>=0.7",
  "mdformat-gfm>=0.4",
  "mdformat-tables>=1.0",
  "mdformat-frontmatter>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libharness = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
  "slow: marks tests as slow",
  "live: marks tests that require the sandboxed pi install and may call a real LLM",
]

[tool.coverage.run]
source = ["src/libharness"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
packages = ["libharness"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = "local.venv"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "SIM",    # flake8-simplify
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "SIM108", # ternary operator suggestion
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["libharness"]
